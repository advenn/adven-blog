# baseURL is root-relative + relativeURLs so links follow whatever domain
# actually serves the site (pages.dev, preview, or the custom domain once live).
# When bek-kurbonov.com is active, set baseURL back to https://bek-kurbonov.com/
# and remove relativeURLs for proper absolute canonical/sitemap/RSS URLs.
baseURL: /
relativeURLs: true
canonifyURLs: false
languageCode: en-us
title: Asadbek Kurbonov
pagination:
  pagerSize: 10
caches:
  images:
    dir: :cacheDir/images

theme: [ "PaperMod" ]

params:
  ShowReadingTime: true
  ShowShareButtons: false

  # Comments on every post. Opt a single post out with `comments: false` in its
  # front matter. Rendered by layouts/_partials/comments.html (giscus).
  comments: true
  giscus:
    repo: advenn/adven-blog
    repoId: R_kgDOTQhqyQ
    category: Announcements
    # From https://giscus.app. The comments partial renders nothing while empty.
    categoryId: "DIC_kwDOTQhqyc4DB9r_"
    mapping: pathname
    reactionsEnabled: "1"
    inputPosition: bottom
    lang: en